plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.musicplatform'
version = '0.1.0'

android {
  namespace 'expo.modules.musicplatform'
  defaultConfig {
    minSdkVersion 31
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Uses ReadableMap at the bridge boundary; version supplied by the React Native Gradle plugin.
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.media3:media3-exoplayer:1.11.0'
  implementation 'androidx.media3:media3-session:1.11.0'
  testImplementation 'junit:junit:4.13.2'
}
